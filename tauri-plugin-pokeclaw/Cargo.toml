[package]
name = "tauri-plugin-pokeclaw"
version = "0.1.0"
edition = "2021"
authors = ["Jaron"]
description = "Pokeclaw Android plugin"
links = "tauri-plugin-pokeclaw"

[dependencies]
tauri = { version = "2.10.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["time"] }

# Desktop-only: dynamic library loading for LiteRT-LM FFI shim
[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = "0.8"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
enigo = "0.3"
arboard = "3"
sysinfo = "0.33"
xcap = "0.9.4"
image = "0.25.5"

[build-dependencies]
tauri-plugin = { version = "2.0.0", features = ["build"] }

[dev-dependencies]
tempfile = "3"
